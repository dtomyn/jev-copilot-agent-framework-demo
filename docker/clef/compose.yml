# Cloudflare Clef served locally on the System-One contract. See docs/CLEF.md before starting
# this: the model is 9B parameters in BF16, which needs about 19 GB for the weights alone, on a
# GPU (compose.gpu.yml) or, much more slowly, in the container's RAM.
services:
  clef:
    build:
      context: ../..
      dockerfile: docker/clef/Dockerfile
      args:
        CLEF_BACKEND: ${CLEF_BACKEND:-cpu}
    ports:
      - "127.0.0.1:${CLEF_HOST_PORT:-8012}:8000"
    environment:
      CLEF_MODEL: ${CLEF_MODEL:-clef-flash}
      CLEF_REVISION: ${CLEF_REVISION:-}
      CLEF_DEVICE: ${CLEF_DEVICE:-auto}
      CLEF_API_KEY: ${CLEF_API_KEY:-}
      CLEF_MAX_QUEUED: ${CLEF_MAX_QUEUED:-4}
      HF_HOME: /models
    volumes:
      - clef-model-cache:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 15s
      timeout: 6s
      retries: 6
      # The first start downloads the weights, so the healthcheck is lenient for a long time.
      start_period: 60m
    restart: unless-stopped

volumes:
  clef-model-cache:
