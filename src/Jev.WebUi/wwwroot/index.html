<!doctype html>
<html lang="en" data-theme="light" data-present="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten Levels of Typed Decisions - live demo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#9878;</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">Ten Levels of Typed Decisions <span>&middot; live demo</span></div>

  <div class="field">
    <label id="provider-label">Provider</label>
    <div class="seg" id="provider-seg" role="group" aria-labelledby="provider-label">
      <button type="button" data-provider="laya">Laya</button>
      <button type="button" data-provider="decider">Decider</button>
      <button type="button" data-provider="clef">Clef</button>
      <button type="button" data-provider="jev">Jev</button>
    </div>
  </div>

  <div class="field">
    <label id="mode-label">Mode</label>
    <div class="seg" id="mode-seg" role="group" aria-labelledby="mode-label">
      <button type="button" data-mode="mock">Mock</button>
      <button type="button" data-mode="live">Live</button>
    </div>
  </div>

  <span class="statusdot" id="statusdot"></span>
  <span class="status-text" id="statustext">Loading...</span>

  <div class="spacer"></div>

  <button type="button" class="btn" id="config-open" aria-haspopup="dialog" title="Set the TypeSafe API key for live Jev">Config</button>
  <a class="btn" id="tutorial-link" href="/tutorial" target="_blank" rel="noopener" title="Open the full step-by-step tutorial">Tutorial</a>
  <button type="button" class="btn" id="notes-toggle" aria-pressed="true" title="Show the presenter notes from docs/tutorial.html">Notes: on</button>
  <button type="button" class="btn" id="present-toggle" aria-pressed="false" title="Scale up for a projector">Presenter</button>
  <button type="button" class="btn" id="theme-toggle" title="Toggle light and dark">Dark</button>
</header>

<div class="shell">
  <nav class="rail" aria-label="Levels">
    <h2>Levels</h2>
    <div id="rail"></div>
  </nav>
  <main id="main" aria-live="polite"></main>
</div>

<!-- Static rather than built by app.js: it is the same dialog on every level. -->
<dialog class="modal" id="config-dialog" aria-labelledby="config-title">
  <div class="modal-head">
    <h2 id="config-title">Configuration</h2>
    <button type="button" class="iconbtn modal-close" id="config-close" aria-label="Close">&times;</button>
  </div>
  <div class="modal-body">
    <div class="ctl">
      <label for="jev-key">TypeSafe API key</label>
      <div class="keystatus" id="jev-key-status"><span class="statusdot"></span><span></span></div>
      <!-- No <form>, and the password-manager opt-outs, so saving a key does not offer to store it
           as a login for 127.0.0.1. -->
      <input type="password" id="jev-key" class="mono" autocomplete="off" spellcheck="false"
             autocapitalize="off" data-1p-ignore data-lpignore="true" data-bwignore
             placeholder="Paste a key to enable live Jev">
      <span class="hint">Sent only to this UI on 127.0.0.1 and applied as <code>TYPESAFE_API_KEY</code>
        for it and the levels it starts, as if it had been set in the shell. Held in memory, never
        written to disk, and gone when the UI stops.</span>
    </div>
    <div class="err" id="config-error" role="alert" hidden></div>
  </div>
  <div class="modal-foot">
    <button type="button" class="btn btn-ghost" id="jev-key-clear">Clear key</button>
    <div class="spacer"></div>
    <button type="button" class="btn" id="config-cancel">Close</button>
    <button type="button" class="btn btn-primary" id="jev-key-save">Save key</button>
  </div>
</dialog>

<script src="highlight.js"></script>
<script src="app.js"></script>
</body>
</html>
